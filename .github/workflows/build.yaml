on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
        build_type: [debug, release]

    env:
      DEBUG_ANDROID_API_LEVEL: 33
      GENERATOR: "Ninja"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true
          local-cache: true

      - name: Export ANDROID_NDK
        run: echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Build
        run: make ${{ matrix.build_type }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            build/**/*.so

  build-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G Ninja
          -D CMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: >
          cmake --build build --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.build_type }}
          path: |
            build/**/*.dll
